[discord]
bot_token = "${DISCORD_BOT_TOKEN}"
allowed_channels = ["${CHANNEL_CARTMAN}"]
allow_user_messages = "involved"
allow_bot_messages = "all"
trusted_bot_ids = ["1506269965521518662", "1506271868561129594", "1506272572655014038", "1506273240601853983"]

[agent]
command = "claude-agent-acp"
args = []
working_dir = "/home/agent/projects"

[pool]
max_sessions = 10
session_ttl_hours = 24

[reactions]
enabled = true
remove_after_reply = false

[reactions.emojis]
queued = "👀"
thinking = "🤔"
tool = "🔥"
coding = "👑"
web = "⚡"
done = "🆗"
error = "😱"

[reactions.timing]
debounce_ms = 700
stall_soft_ms = 10000
stall_hard_ms = 30000
done_hold_ms = 1500
error_hold_ms = 2500
